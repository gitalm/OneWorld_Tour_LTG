<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One World Tour – Schulkonzert 2026</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000;
        }

        /* Kleines Heading */
        #heading {
            position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
            color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.2em; font-weight: 300; letter-spacing: 3px;
            z-index: 999; pointer-events: none;
            text-shadow: 0 1px 6px rgba(0,0,0,0.7);
            opacity: 0.85;
        }

        /* Infopanel */
        #infoPanel {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: white; padding: 10px 25px; border-radius: 10px;
            font-family: 'Segoe UI', sans-serif; text-align: center;
            z-index: 1000; pointer-events: none; backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.15); transition: opacity 0.4s;
            max-width: 85vw;
        }
        #infoPanel h2 { margin: 0; font-size: 1.05em; font-weight: 400; opacity: 0.9; }
        #infoPanel .hint {
            margin-top: 5px; font-size: 0.8em; opacity: 0.55; letter-spacing: 1px;
        }
        #progressBar {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 60%; max-width: 600px; height: 5px; background: rgba(255,255,255,0.2);
            border-radius: 3px; z-index: 1000; overflow: hidden;
        }
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #2196F3, #FF9800, #9C27B0);
            background-size: 300% 100%; animation: gradientMove 3s ease infinite;
            border-radius: 3px; width: 0%; transition: width 0.4s ease;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }
        #controls {
            position: absolute; bottom: 20px; right: 20px; z-index: 1001; display: flex; gap: 10px;
        }
        #controls button {
            background: rgba(0,0,0,0.65); color: white; border: 1px solid rgba(255,255,255,0.25);
            padding: 12px 24px; border-radius: 25px; cursor: pointer; font-size: 15px;
            backdrop-filter: blur(8px); transition: all 0.3s;
        }
        #controls button:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); }
        #controls button.primary {
            background: rgba(76,175,80,0.65); border-color: rgba(76,175,80,0.6); font-weight: 600;
        }
        #controls button.primary:hover { background: rgba(76,175,80,0.85); }

        #btnToggleStations {
            position: absolute; top: 18px; right: 18px; z-index: 1003;
            background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2);
            padding: 7px 14px; border-radius: 18px; cursor: pointer; font-size: 12px;
            backdrop-filter: blur(6px); transition: all 0.3s; font-family: 'Segoe UI', sans-serif;
        }
        #btnToggleStations:hover { background: rgba(255,255,255,0.15); }
        #stationList {
            position: absolute; top: 55px; right: 18px; background: rgba(0,0,0,0.75); color: white;
            padding: 12px 18px; border-radius: 10px; font-family: 'Segoe UI', sans-serif; font-size: 12px;
            z-index: 1002; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15);
            opacity: 0; transform: translateY(-8px); transition: all 0.35s ease; pointer-events: none;
        }
        #stationList.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        #stationList .station { padding: 3px 0; opacity: 0.4; transition: all 0.4s; white-space: nowrap; }
        #stationList .station.current { opacity: 1; font-weight: bold; color: #FFD700; }
        #stationList .station.done { opacity: 0.65; color: #4CAF50; }

        /* ============ VOLLBILD-SLIDESHOW (ohne Titel) ============ */
        #slideshowOverlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #slideshowOverlay.visible { opacity: 1; pointer-events: auto; }
        #slideshowImageContainer {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            background: #000;
        }
        #slideshowImageContainer img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            opacity: 0; transition: opacity 1s ease;
            background: #000;
        }
        #slideshowImageContainer img.active { opacity: 1; }
        #slideshowDots {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; z-index: 2005; pointer-events: auto;
        }
        #slideshowDots .dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: rgba(255,255,255,0.35); transition: all 0.3s; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.25);
        }
        #slideshowDots .dot.active { background: #FFD700; transform: scale(1.35); border-color: #FFD700; }

        /* ============ STAR-WARS CRAWL ============ */
        #finaleOverlay {
            position: absolute; inset: 0; z-index: 3000;
            background: rgba(0,0,0,0.88);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        #finaleOverlay.visible { display: flex; }
        .starwars-crawl {
            perspective: 600px; width: 85%; max-width: 950px; height: 80vh;
            overflow: hidden; position: relative;
        }
        .crawl-text {
            position: absolute; bottom: -120%; width: 100%; text-align: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.5em; line-height: 2;
            color: #FFD700; text-shadow: 0 0 8px rgba(255,215,0,0.4);
            animation: crawl 45s linear forwards;
        }
        @keyframes crawl {
            0%   { bottom: -120%; transform: rotateX(20deg) translateZ(0); opacity: 1; }
            85%  { opacity: 1; }
            100% { bottom: 110%; transform: rotateX(20deg) translateZ(0); opacity: 0; }
        }
        .crawl-text h2 { font-size: 2.2em; margin-bottom: 0.5em; letter-spacing: 4px; text-transform: uppercase; color: #FFF; text-shadow: 0 0 20px rgba(255,215,0,0.6); }
        .crawl-text .subtitle { font-size: 1.3em; color: #FFD700; margin: 1em 0; letter-spacing: 2px; }
        .crawl-text p { margin: 0.3em 0; }
        .crawl-text .lyrics { font-style: italic; font-size: 1.6em; margin: 1em 0; color: #FFF; text-shadow: 0 0 15px rgba(255,255,255,0.5); line-height: 1.7; }
        .crawl-text .thanks { font-size: 1.3em; margin-top: 1.5em; color: #FFD700; }
        #finaleClose {
            position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,215,0,0.35);
            padding: 10px 28px; border-radius: 25px; cursor: pointer; font-size: 15px;
            z-index: 3005; font-family: 'Segoe UI', sans-serif; letter-spacing: 1px;
            transition: all 0.3s;
        }
        #finaleClose:hover { background: rgba(255,215,0,0.15); border-color: #FFD700; }

        @media (max-width: 700px) {
            .crawl-text { font-size: 1.1em; }
            .starwars-crawl { height: 70vh; width: 92%; }
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <div id="heading">🌍 One World Tour</div>

    <button id="btnToggleStations">☰</button>

    <div id="infoPanel">
        <h2 id="stationName">Willkommen</h2>
        <div class="hint" id="hintText">Taste [Leertaste] oder [→] zum Starten</div>
    </div>
    <div id="stationList">
        <div class="station" data-station="0">1. Afrika – Africa (Toto)</div>
        <div class="station" data-station="1">2. Norwegen – Peer Gynt Suite</div>
        <div class="station" data-station="2">3. Ungarn – Ungarischer Tanz Nr. 5</div>
        <div class="station" data-station="3">4. Südamerika – Sunday in Rio</div>
        <div class="station" data-station="4">5. Irland – Irish Suite</div>
        <div class="station" data-station="5">6. China – Mo Li Hua</div>
        <div class="station" data-station="6">7. Südafrika – Baba Yetu</div>
    </div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div id="controls">
        <button id="btnPrev" title="Zurück">◀</button>
        <button id="btnNext" class="primary" title="Nächste Station">▶ Start</button>
    </div>

    <!-- VOLLBILD-SLIDESHOW -->
    <div id="slideshowOverlay">
        <div id="slideshowImageContainer"></div>
        <div id="slideshowDots"></div>
    </div>

    <!-- FINALE -->
    <div id="finaleOverlay">
        <div class="starwars-crawl">
            <div class="crawl-text" id="crawlText"></div>
        </div>
        <button id="finaleClose">✕ Schließen</button>
    </div>

    <script>
        (async function initCesium() {
            // ============================================================
            // 🌍 GLOBALE EINSTELLUNGEN – HIER ANPASSEN
            // ============================================================
            const SLIDESHOW_CYCLES  = 2;       // Wie oft die Bilder durchlaufen (2 = 2x alle)
            const SLIDESHOW_INTERVAL = 2500;  // Wechselgeschwindigkeit in ms (2500 = 2,5 s)
            const SLIDESHOW_DELAY    = 800;   // Wartezeit nach Ankunft bis Slideshow startet (ms)
            const SLIDESHOW_HIDE_DELAY = 500; // Wartezeit bis Slideshow ausgeblendet wird (ms)
            const CRAWL_DURATION     = 45;    // Dauer des Star-Wars-Textes in Sekunden
            const ROTATION_SPEED     = 0.03;  // Wie schnell die Erde rotiert (Grad/s)
            const EARTH_ALTITUDE     = 20000000; // Höhe der Kamera im Finale (Meter)
            const EARTH_PITCH        = -65;   // Neigung im Finale (Grad)

            // ============================================================
            // 🖼️ LOKALE BILDER
            // ============================================================
            const IMG = 'images/'; // Ordnerpfad – muss neben index.html liegen

            Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI1NGU3YzJkYi1mNTRjLTQxNDAtYTA2Ny02OTJlMjFiMzljOWUiLCJpZCI6NDQ1MTUxLCJzdWIiOiJBbEoiLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoiT25lV29ybGQiLCJpYXQiOjE3ODE2MDQwNTl9.bWQpQQXdJoZ1CLp190p4YJkS9AtMi0m99vyVMOOejYY';

            const viewer = new Cesium.Viewer('cesiumContainer', {
                animation: false, timeline: false, baseLayerPicker: false,
                fullscreenButton: false, homeButton: false, sceneModePicker: false,
                navigationHelpButton: false, geocoder: false, selectionIndicator: false,
                infoBox: false
            });

            viewer.imageryLayers.removeAll();
            viewer.imageryLayers.addImageryProvider(
                await Cesium.IonImageryProvider.fromAssetId(3954)
            );
            viewer.scene.skyAtmosphere.show = true;
            viewer.scene.globe.enableLighting = true;
            viewer.scene.globe.showGroundAtmosphere = true;
            viewer.cesiumWidget.creditContainer.style.display = 'none';

            // ============================================================
            // 🌍 DESTINATIONS
            // ============================================================
            const destinations = [
                {
                    name: 'Afrika – Kilimandscharo Region',
                    subtitle: 'Africa (Toto)',
                    lat: -3.0, lon: 37.0, altitude: 900000, heading: 0, pitch: -52, duration: 8,
                    media: [
                        IMG + 'africa1.jpg',
                        IMG + 'africa2.jpg',
                        IMG + 'africa3.jpg'
                    ]
                },
                {
                    name: 'Norwegen – Fjorde & Berge',
                    subtitle: 'Peer Gynt Suite (Grieg)',
                    lat: 62.5, lon: 8.5, altitude: 700000, heading: 0, pitch: -55, duration: 8,
                    media: [
                        IMG + 'norway1.jpg',
                        IMG + 'norway2.jpg',
                        IMG + 'norway3.jpg'
                    ]
                },
                {
                    name: 'Ungarn – Puszta',
                    subtitle: 'Ungarischer Tanz Nr. 5 (Brahms)',
                    lat: 47.0, lon: 19.2, altitude: 480000, heading: 0, pitch: -48, duration: 7,
                    media: [
                        IMG + 'hungary1.jpg',
                        IMG + 'hungary2.jpg',
                        IMG + 'hungary3.jpg'
                    ]
                },
                {
                    name: 'Südamerika – Brasilien',
                    subtitle: 'Sunday in Rio / La Cucaracha',
                    lat: -17.0, lon: -47.0, altitude: 3000000, heading: 0, pitch: -55, duration: 8,
                    media: [
                        IMG + 'brasil1.jpg',
                        IMG + 'brasil2.jpg',
                        IMG + 'brasil3.jpg'
                    ]
                },
                {
                    name: 'Irland – Grüne Insel',
                    subtitle: 'Irish Suite (Anderson)',
                    lat: 53.2, lon: -8.0, altitude: 580000, heading: 0, pitch: -55, duration: 7,
                    media: [
                        IMG + 'ireland1.jpg',
                        IMG + 'ireland2.jpg',
                        IMG + 'ireland3.jpg'
                    ]
                },
                {
                    name: 'China – Jasminblüte',
                    subtitle: 'Mo Li Hua',
                    lat: 32.0, lon: 112.0, altitude: 2400000, heading: 0, pitch: -55, duration: 8,
                    media: [
                        IMG + 'china1.jpg',
                        IMG + 'china2.jpg',
                        IMG + 'china3.jpg'
                    ]
                },
                {
                    name: 'Südafrika',
                    subtitle: 'Baba Yetu',
                    lat: -31.0, lon: 24.0, altitude: 2300000, heading: 0, pitch: -58, duration: 9,
                    media: [
                        IMG + 'safrica1.jpg',
                        IMG + 'safrica2.jpg',
                        IMG + 'safrica3.jpg'
                    ]
                }
            ];

            // ============================================================
            // STATE
            // ============================================================
            let currentStation = -1;       // -1 = Start vor Station 0!
            let isFinaleActive = false;
            let slideshowTimer = null;
            let slideshowImageIndex = 0;
            let slideshowCycleCount = 0;
            let animationInProgress = false;
            let waitingForUser = true;
            let isEarthRotating = false;
            let hasStarted = false;        // noch kein Klick = Weltansicht

            // UI
            const stationNameEl = document.getElementById('stationName');
            const hintText = document.getElementById('hintText');
            const progressFill = document.getElementById('progressFill');
            const btnNext = document.getElementById('btnNext');
            const btnPrev = document.getElementById('btnPrev');
            const stationItems = document.querySelectorAll('#stationList .station');
            const stationList = document.getElementById('stationList');
            const slideshowOverlay = document.getElementById('slideshowOverlay');
            const slideshowImageContainer = document.getElementById('slideshowImageContainer');
            const slideshowDots = document.getElementById('slideshowDots');
            const finaleOverlay = document.getElementById('finaleOverlay');
            const crawlText = document.getElementById('crawlText');

            function updateUI() {
                if (isFinaleActive) {
                    stationNameEl.textContent = 'One World – Finale';
                    hintText.textContent = 'Die Erde rotiert – [Leertaste] für den Abschlusstext';
                } else if (currentStation === -1) {
                    stationNameEl.textContent = 'Willkommen';
                    hintText.textContent = 'Taste [Leertaste] oder [→] zum Starten';
                } else {
                    const dest = destinations[currentStation];
                    stationNameEl.textContent = dest.name + ' – ' + dest.subtitle;
                    hintText.textContent = waitingForUser
                        ? 'Taste [Leertaste] oder [→] für nächste Station'
                        : '';
                }

                const total = destinations.length;
                const progress = isFinaleActive ? 1 : (currentStation === -1 ? 0 : (currentStation / total));
                progressFill.style.width = `${progress * 100}%`;

                stationItems.forEach((item, i) => {
                    item.classList.remove('current', 'done');
                    if (i === currentStation && !isFinaleActive && currentStation >= 0) item.classList.add('current');
                    if (i < currentStation || isFinaleActive) item.classList.add('done');
                });
            }

            // ============================================================
            // STATIONSLISTE
            // ============================================================
            let stationListVisible = false;
            document.getElementById('btnToggleStations').addEventListener('click', () => {
                stationListVisible = !stationListVisible;
                stationList.classList.toggle('visible', stationListVisible);
            });

            // ============================================================
            // VOLLBILD-SLIDESHOW
            // ============================================================
            function showSlideshow(dest) {
                if (!dest.media || dest.media.length === 0) return;

                slideshowImageContainer.innerHTML = '';
                slideshowDots.innerHTML = '';

                dest.media.forEach((src, i) => {
                    const imgEl = document.createElement('img');
                    imgEl.src = src; imgEl.alt = ''; imgEl.loading = 'lazy';
                    if (i === 0) imgEl.classList.add('active');
                    imgEl.onerror = function() {
                        this.style.display = 'none';
                        console.warn('Bild nicht gefunden:', src);
                    };
                    slideshowImageContainer.appendChild(imgEl);

                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    if (i === 0) dot.classList.add('active');
                    dot.addEventListener('click', () => switchSlideshowImage(i));
                    slideshowDots.appendChild(dot);
                });

                slideshowImageIndex = 0;
                slideshowCycleCount = 0;
                slideshowOverlay.classList.add('visible');
                startSlideshowRotation(dest);
            }

            function startSlideshowRotation(dest) {
                if (slideshowTimer) clearInterval(slideshowTimer);
                const totalImages = dest.media.length;
                const totalSwitches = totalImages * SLIDESHOW_CYCLES;

                slideshowTimer = setInterval(() => {
                    slideshowCycleCount++;
                    const images = slideshowImageContainer.querySelectorAll('img');
                    const dots = slideshowDots.querySelectorAll('.dot');
                    if (images.length === 0) return;

                    images[slideshowImageIndex].classList.remove('active');
                    dots[slideshowImageIndex].classList.remove('active');
                    slideshowImageIndex = (slideshowImageIndex + 1) % totalImages;
                    images[slideshowImageIndex].classList.add('active');
                    dots[slideshowImageIndex].classList.add('active');

                    if (slideshowCycleCount >= totalSwitches) {
                        clearInterval(slideshowTimer);
                        slideshowTimer = null;
                        setTimeout(() => {
                            hideSlideshow();
                            waitingForUser = true;
                            updateUI();
                        }, SLIDESHOW_HIDE_DELAY);
                    }
                }, SLIDESHOW_INTERVAL);
            }

            function switchSlideshowImage(index) {
                const images = slideshowImageContainer.querySelectorAll('img');
                const dots = slideshowDots.querySelectorAll('.dot');
                if (images.length === 0) return;
                images[slideshowImageIndex].classList.remove('active');
                dots[slideshowImageIndex].classList.remove('active');
                slideshowImageIndex = index;
                images[slideshowImageIndex].classList.add('active');
                dots[slideshowImageIndex].classList.add('active');
            }

            function hideSlideshow() {
                slideshowOverlay.classList.remove('visible');
                if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; }
            }

            // ============================================================
            // KAMERA
            // ============================================================
            let rotationListener = null;

            function cancelRotation() {
                if (rotationListener) {
                    viewer.scene.postRender.removeEventListener(rotationListener);
                    rotationListener = null;
                }
                isEarthRotating = false;
            }

            function flyToDestination(index) {
                if (index < 0 || index >= destinations.length) return;
                cancelRotation();
                hideSlideshow();
                waitingForUser = false;
                isFinaleActive = false;
                finaleOverlay.classList.remove('visible');
                hasStarted = true;

                currentStation = index;
                animationInProgress = true;
                updateUI();

                const dest = destinations[currentStation];
                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, dest.altitude),
                    orientation: {
                        heading: Cesium.Math.toRadians(dest.heading),
                        pitch: Cesium.Math.toRadians(dest.pitch),
                        roll: Cesium.Math.toRadians(0)
                    },
                    duration: dest.duration,
                    easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT,
                    complete: function() {
                        animationInProgress = false;
                        viewer.camera.setView({
                            destination: Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, dest.altitude),
                            orientation: {
                                heading: Cesium.Math.toRadians(0),
                                pitch: Cesium.Math.toRadians(dest.pitch),
                                roll: Cesium.Math.toRadians(0)
                            }
                        });
                        setTimeout(() => showSlideshow(dest), SLIDESHOW_DELAY);
                    }
                });
            }

            function nextStation() {
                if (animationInProgress || isFinaleActive) return;
                hideSlideshow();

                if (!hasStarted) {
                    // Erstes Mal: von Weltansicht nach Afrika
                    flyToDestination(0);
                } else if (currentStation < destinations.length - 1) {
                    flyToDestination(currentStation + 1);
                } else if (currentStation === destinations.length - 1) {
                    startFinale();
                }
            }

            function prevStation() {
                if (animationInProgress || isFinaleActive) return;
                if (!hasStarted) return;
                hideSlideshow();
                if (currentStation > 0) flyToDestination(currentStation - 1);
            }

            // ============================================================
            // FINALE
            // ============================================================
            function startFinale() {
                isFinaleActive = true;
                waitingForUser = false;
                animationInProgress = true;
                hideSlideshow();
                updateUI();

                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(15, 0, EARTH_ALTITUDE),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(EARTH_PITCH),
                        roll: Cesium.Math.toRadians(0)
                    },
                    duration: 5,
                    easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT,
                    complete: function() {
                        animationInProgress = false;
                        isEarthRotating = true;
                        startEarthRotation();
                        updateUI();
                    }
                });
            }

            function startEarthRotation() {
                cancelRotation();
                let lastTime = null;

                rotationListener = function(scene, time) {
                    if (!lastTime) lastTime = time;
                    const delta = Cesium.JulianDate.secondsDifference(time, lastTime);
                    lastTime = time;
                    const camera = viewer.camera;
                    const pos = camera.position;
                    const carto = Cesium.Cartographic.fromCartesian(pos);
                    const newLon = Cesium.Math.toDegrees(carto.longitude) - ROTATION_SPEED * delta;
                    camera.setView({
                        destination: Cesium.Cartesian3.fromDegrees(
                            ((newLon % 360) + 360) % 360, 0, carto.height
                        ),
                        orientation: {
                            heading: Cesium.Math.toRadians(0),
                            pitch: Cesium.Math.toRadians(EARTH_PITCH),
                            roll: Cesium.Math.toRadians(0)
                        }
                    });
                };
                viewer.scene.postRender.addEventListener(rotationListener);
            }

            // ============================================================
            // STAR-WARS CRAWL
            // ============================================================
            function showDreamCrawl() {
                finaleOverlay.classList.add('visible');
                crawlText.innerHTML = `
                    <h2>🌟 One World 🌟</h2>
                    <div class="subtitle">Schulkonzert 2026</div>
                    <br>
                    <div class="lyrics">
                        "We only have one world,<br>
                        We only have one love<br>
                        We have so little time together you and I<br>
                        And all we have to do is try<br>
                        <br>
                        We just need to walk together<br>
                        We just need to talk together<br>
                        We just need to come together<br>
                        In our hearts<br>
                        <br>
                        We only have one world<br>
                        We only have one love<br>
                        We have so little time together you and I<br>
                        And all we have to do is try"
                    </div>
                    <br>
                    <p>— Lionel Richie</p>
                    <br>
                    <div class="thanks">
                        🌍 Vielen Dank, dass Sie uns auf dieser Reise begleitet haben! 🌍
                    </div>
                    <br>
                    <p>Ein herzlicher Dank gilt Herrn Almer</p>
                    <p>für die klimaneutralen Reisen mit seinen Animationen!</p>
                    <br>
                    <p>Wir wünschen Ihnen ein schönes Schulfest!</p>
                    <br>
                    <p style="font-size:2em; letter-spacing:6px;">🎵🌍🎵</p>
                `;
                const el = document.querySelector('.crawl-text');
                el.style.animation = 'none';
                el.offsetHeight;
                el.style.animation = 'crawl ' + CRAWL_DURATION + 's linear forwards';
            }

            function hideFinale() {
                finaleOverlay.classList.remove('visible');
                if (!isEarthRotating) startEarthRotation();
                updateUI();
            }

            document.getElementById('finaleClose').addEventListener('click', hideFinale);

            // ============================================================
            // BUTTONS & TASTATUR
            // ============================================================
            btnNext.addEventListener('click', () => {
                if (isFinaleActive) {
                    if (!finaleOverlay.classList.contains('visible')) showDreamCrawl();
                    else hideFinale();
                } else {
                    nextStation();
                }
            });
            btnPrev.addEventListener('click', prevStation);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    if (isFinaleActive) {
                        if (!finaleOverlay.classList.contains('visible')) showDreamCrawl();
                        else hideFinale();
                    } else {
                        nextStation();
                    }
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevStation();
                } else if (e.key === 'Escape') {
                    if (finaleOverlay.classList.contains('visible')) hideFinale();
                    else { hideSlideshow(); waitingForUser = true; updateUI(); }
                }
            });

            // Button-Text live
            setInterval(() => {
                if (!hasStarted) {
                    btnNext.textContent = '▶ Start';
                } else if (isFinaleActive && !finaleOverlay.classList.contains('visible')) {
                    btnNext.textContent = '✨ Abschlusstext';
                } else if (finaleOverlay.classList.contains('visible')) {
                    btnNext.textContent = '✕ Schließen';
                } else if (currentStation >= destinations.length - 1 && hasStarted) {
                    btnNext.textContent = '🎬 Finale';
                } else {
                    btnNext.textContent = 'Nächste Station ▶';
                }
            }, 300);

            // ============================================================
            // START: Weltansicht, warten auf Klick
            // ============================================================
            viewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(15, 5, 22000000),
                orientation: {
                    heading: Cesium.Math.toRadians(0),
                    pitch: Cesium.Math.toRadians(-60),
                    roll: Cesium.Math.toRadians(0)
                }
            });

            updateUI();

            console.log('🌍 One World Tour bereit!');
            console.log('Bilder aus:', IMG);
            console.log('Start: Weltansicht – erster Klick startet Reise nach Afrika');
        })();
    </script>
</body>
</html>

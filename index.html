<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One World Tour – Schulkonzert 2026</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        #infoPanel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: opacity 0.5s;
        }
        #infoPanel h1 {
            margin: 0;
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 2px;
        }
        #infoPanel h2 {
            margin: 5px 0 0 0;
            font-size: 1.1em;
            font-weight: 300;
            opacity: 0.85;
        }
        #progressBar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 600px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            z-index: 1000;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #2196F3, #FF9800, #9C27B0);
            background-size: 300% 100%;
            animation: gradientMove 3s ease infinite;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
            display: flex;
            gap: 10px;
        }
        #controls button {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
        }
        #controls button.active {
            background: rgba(76, 175, 80, 0.7);
            border-color: #4CAF50;
        }

        /* ============ STATIONSLISTE (standardmäßig ausgeblendet) ============ */
        #btnToggleStations {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1003;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }
        #btnToggleStations:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        #stationList {
            position: absolute;
            top: 65px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            z-index: 1002;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.4s ease;
        }
        #stationList.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        #stationList .station {
            padding: 4px 0;
            opacity: 0.45;
            transition: all 0.4s;
            white-space: nowrap;
        }
        #stationList .station.current {
            opacity: 1;
            font-weight: bold;
            color: #FFD700;
        }
        #stationList .station.done {
            opacity: 0.7;
            color: #4CAF50;
        }

        /* ============ SLIDESHOW – große Bilder, automatisch wechselnd ============ */
        #slideshowOverlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.7s ease;
        }
        #slideshowOverlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #slideshowOverlay .slideshow-title {
            color: #FFD700;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.6em;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }
        #slideshowImageContainer {
            position: relative;
            width: 75vw;
            max-width: 1100px;
            height: 55vh;
            max-height: 600px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: #111;
        }
        #slideshowImageContainer img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease;
        }
        #slideshowImageContainer img.active {
            opacity: 1;
        }
        #slideshowClose {
            position: absolute;
            top: 25px;
            right: 35px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2005;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        #slideshowClose:hover {
            background: rgba(255,255,255,0.3);
        }
        #slideshowDots {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        #slideshowDots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transition: all 0.3s;
        }
        #slideshowDots .dot.active {
            background: #FFD700;
            transform: scale(1.3);
        }

        @media (max-width: 700px) {
            #slideshowImageContainer {
                width: 90vw;
                height: 40vh;
            }
            #slideshowOverlay .slideshow-title {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <button id="btnToggleStations">☰ Stationen</button>

    <div id="infoPanel">
        <h1>🌍 One World Tour</h1>
        <h2 id="stationName">Start</h2>
    </div>
    <div id="stationList">
        <div class="station" data-station="0">1. Afrika – Africa (Toto)</div>
        <div class="station" data-station="1">2. Norwegen – Peer Gynt Suite</div>
        <div class="station" data-station="2">3. Ungarn – Ungarischer Tanz Nr. 5</div>
        <div class="station" data-station="3">4. Südamerika – Sunday in Rio</div>
        <div class="station" data-station="4">5. Irland – Irish Suite</div>
        <div class="station" data-station="5">6. China – Mo Li Hua</div>
        <div class="station" data-station="6">7. Südafrika – Baba Yetu</div>
    </div>
    <div id="progressBar">
        <div id="progressFill"></div>
    </div>
    <div id="controls">
        <button id="btnPrev" title="Vorherige Station">◀</button>
        <button id="btnPlay" class="active" title="Auto-Play">▶</button>
        <button id="btnNext" title="Nächste Station">▶▶</button>
    </div>

    <!-- SLIDESHOW OVERLAY (groß, automatisch wechselnd) -->
    <div id="slideshowOverlay">
        <button id="slideshowClose" title="Schließen">✕</button>
        <div class="slideshow-title" id="slideshowTitle"></div>
        <div id="slideshowImageContainer"></div>
        <div id="slideshowDots"></div>
    </div>

    <script>
        (async function initCesium() {
            Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI1NGU3YzJkYi1mNTRjLTQxNDAtYTA2Ny02OTJlMjFiMzljOWUiLCJpZCI6NDQ1MTUxLCJzdWIiOiJBbEoiLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoiT25lV29ybGQiLCJpYXQiOjE3ODE2MDQwNTl9.bWQpQQXdJoZ1CLp190p4YJkS9AtMi0m99vyVMOOejYY';

            const viewer = new Cesium.Viewer('cesiumContainer', {
                animation: false, timeline: false, baseLayerPicker: false,
                fullscreenButton: false, homeButton: false, sceneModePicker: false,
                navigationHelpButton: false, geocoder: false, selectionIndicator: false,
                infoBox: false
            });

            viewer.imageryLayers.removeAll();
            viewer.imageryLayers.addImageryProvider(
                await Cesium.IonImageryProvider.fromAssetId(3954)
            );

            viewer.scene.skyAtmosphere.show = true;
            viewer.scene.globe.enableLighting = true;
            viewer.scene.globe.showGroundAtmosphere = true;
            viewer.cesiumWidget.creditContainer.style.display = 'none';

            // ========================================
            // BILDER: Lokaler Pfad (später anpassen!)
            // ========================================
            const IMAGE_BASE = 'images/';

            // img(lokalerDateiname, unsplashFallbackID)
            function img(localFile, unsplashId) {
                // Für lokale Bilder diese Zeile aktivieren:
                // return IMAGE_BASE + localFile;
                // Für Unsplash-Test (funktioniert sofort):
                return 'https://images.unsplash.com/' + unsplashId + '?w=1200&h=750&fit=crop';
            }

            // ========================================
            // DESTINATIONS – Koordinaten korrigiert
            // ========================================
            const destinations = [
                {
                    // 1. Afrika – Tansania/Kenia
                    name: 'Afrika – Kilimandscharo Region',
                    subtitle: 'Africa (Toto)',
                    lat: -3.0, lon: 37.0,
                    altitude: 900000, heading: 0, pitch: -52,
                    duration: 8,
                    slideshowTitle: '🇹🇿 Tansania – Am Fuße des Kilimandscharo',
                    media: [
                        img('afrika1.jpg', 'photo-1489392191049-fc10c97e64b6'),
                        img('afrika2.jpg', 'photo-1516426122078-c23e76319801'),
                        img('afrika3.jpg', 'photo-1547471080-7cc2caa01a7e')
                    ]
                },
                {
                    // 2. Norwegen – zentral über den Bergen
                    name: 'Norwegen – Fjorde & Berge',
                    subtitle: 'Peer Gynt Suite (Grieg)',
                    lat: 62.5, lon: 8.5,
                    altitude: 700000, heading: 0, pitch: -55,
                    duration: 8,
                    slideshowTitle: '🇳🇴 Norwegen – Land der Fjorde',
                    media: [
                        img('norwegen1.jpg', 'photo-1507003211169-0a1dd7228f2d'),
                        img('norwegen2.jpg', 'photo-1531366936337-7c912a4589a7'),
                        img('norwegen3.jpg', 'photo-1520769669658-f07657f5a307')
                    ]
                },
                {
                    // 3. Ungarn – weiter südlich, zentraler
                    name: 'Ungarn – Puszta',
                    subtitle: 'Ungarischer Tanz Nr. 5 (Brahms)',
                    lat: 47.0, lon: 19.2,
                    altitude: 480000, heading: 0, pitch: -48,
                    duration: 7,
                    slideshowTitle: '🇭🇺 Ungarn – Puszta & Budapest',
                    media: [
                        img('ungarn1.jpg', 'photo-1561212044-37710e0e55a0'),
                        img('ungarn2.jpg', 'photo-1558618666-fcd25c85f82e'),
                        img('ungarn3.jpg', 'photo-1519999482648-25049ddd37b1')
                    ]
                },
                {
                    // 4. Südamerika – Brasilien (Rio sichtbar)
                    name: 'Südamerika – Brasilien',
                    subtitle: 'Sunday in Rio / La Cucaracha',
                    lat: -17.0, lon: -47.0,
                    altitude: 3000000, heading: 0, pitch: -55,
                    duration: 8,
                    slideshowTitle: '🇧🇷 Brasilien – Karneval & Samba',
                    media: [
                        img('brasilien1.jpg', 'photo-1483729558449-99ef09a8c325'),
                        img('brasilien2.jpg', 'photo-1516306580123-e6e52b7b7b9f'),
                        img('brasilien3.jpg', 'photo-1518531933037-91b2f5f229cc')
                    ]
                },
                {
                    // 5. Irland – weiter südlich, damit ganz Irland sichtbar
                    name: 'Irland – Grüne Insel',
                    subtitle: 'Irish Suite (Anderson)',
                    lat: 53.2, lon: -8.0,
                    altitude: 580000, heading: 0, pitch: -55,
                    duration: 7,
                    slideshowTitle: '🇮🇪 Irland – Die grüne Insel',
                    media: [
                        img('irland1.jpg', 'photo-1590089415225-4011816f9db8'),
                        img('irland2.jpg', 'photo-1559827291-baf8ef90a28a'),
                        img('irland3.jpg', 'photo-1564507592333-c60657eea523')
                    ]
                },
                {
                    // 6. China – weiter östlich, mehr Meer
                    name: 'China – Jasminblüte',
                    subtitle: 'Mo Li Hua',
                    lat: 32.0, lon: 112.0,
                    altitude: 2400000, heading: 0, pitch: -55,
                    duration: 8,
                    slideshowTitle: '🇨🇳 China – Reich der Mitte',
                    media: [
                        img('china1.jpg', 'photo-1508804185872-d7badad00f7d'),
                        img('china2.jpg', 'photo-1547981609-4b6bfe67ca0b'),
                        img('china3.jpg', 'photo-1537531383496-f4749b88b357')
                    ]
                },
                {
                    // 7. Südafrika – weiter südlich, Kapstadt sichtbar
                    name: 'Südafrika',
                    subtitle: 'Baba Yetu',
                    lat: -31.0, lon: 24.0,
                    altitude: 2300000, heading: 0, pitch: -58,
                    duration: 9,
                    slideshowTitle: '🇿🇦 Südafrika – Regenbogennation',
                    media: [
                        img('suedafrika1.jpg', 'photo-1580060839134-75a5edca2e99'),
                        img('suedafrika2.jpg', 'photo-1576485290814-1c72aa4bbb8e'),
                        img('suedafrika3.jpg', 'photo-1516026672322-bc52d61a55d5')
                    ]
                }
            ];

            // ========================================
            // STATE
            // ========================================
            let currentStation = 0;
            let isAutoPlaying = true;
            let flightTimeout = null;
            let slideshowTimer = null;
            let slideshowImageIndex = 0;
            let animationInProgress = false;

            // UI
            const stationNameEl = document.getElementById('stationName');
            const progressFill = document.getElementById('progressFill');
            const btnPlay = document.getElementById('btnPlay');
            const stationItems = document.querySelectorAll('#stationList .station');
            const stationList = document.getElementById('stationList');
            const slideshowOverlay = document.getElementById('slideshowOverlay');
            const slideshowTitle = document.getElementById('slideshowTitle');
            const slideshowImageContainer = document.getElementById('slideshowImageContainer');
            const slideshowDots = document.getElementById('slideshowDots');

            function updateUI() {
                stationNameEl.textContent = `${destinations[currentStation].name} – ${destinations[currentStation].subtitle}`;
                progressFill.style.width = `${((currentStation) / (destinations.length - 1)) * 100}%`;
                stationItems.forEach((item, i) => {
                    item.classList.remove('current', 'done');
                    if (i === currentStation) item.classList.add('current');
                    if (i < currentStation) item.classList.add('done');
                });
            }

            // ========================================
            // STATIONSLISTE TOGGLE
            // ========================================
            let stationListVisible = false;
            document.getElementById('btnToggleStations').addEventListener('click', () => {
                stationListVisible = !stationListVisible;
                if (stationListVisible) {
                    stationList.classList.add('visible');
                } else {
                    stationList.classList.remove('visible');
                }
            });

            // ========================================
            // SLIDESHOW (groß, automatisch wechselnd)
            // ========================================
            function showSlideshow(dest) {
                if (!dest.media || dest.media.length === 0) return;

                slideshowTitle.textContent = dest.slideshowTitle || '';
                slideshowImageContainer.innerHTML = '';
                slideshowDots.innerHTML = '';

                dest.media.forEach((src, i) => {
                    const imgEl = document.createElement('img');
                    imgEl.src = src;
                    imgEl.alt = '';
                    imgEl.loading = 'lazy';
                    if (i === 0) imgEl.classList.add('active');
                    imgEl.onerror = function() { this.style.display = 'none'; };
                    slideshowImageContainer.appendChild(imgEl);

                    const dot = document.createElement('div');
                    dot.className = 'dot';
                    if (i === 0) dot.classList.add('active');
                    dot.addEventListener('click', () => switchSlideshowImage(i));
                    slideshowDots.appendChild(dot);
                });

                slideshowImageIndex = 0;
                slideshowOverlay.classList.add('visible');

                // Automatisch wechseln alle 3 Sekunden
                startSlideshowRotation();
            }

            function startSlideshowRotation() {
                if (slideshowTimer) clearInterval(slideshowTimer);
                slideshowTimer = setInterval(() => {
                    const images = slideshowImageContainer.querySelectorAll('img');
                    const dots = slideshowDots.querySelectorAll('.dot');
                    if (images.length === 0) return;

                    images[slideshowImageIndex].classList.remove('active');
                    dots[slideshowImageIndex].classList.remove('active');

                    slideshowImageIndex = (slideshowImageIndex + 1) % images.length;

                    images[slideshowImageIndex].classList.add('active');
                    dots[slideshowImageIndex].classList.add('active');
                }, 3000);
            }

            function switchSlideshowImage(index) {
                const images = slideshowImageContainer.querySelectorAll('img');
                const dots = slideshowDots.querySelectorAll('.dot');
                if (images.length === 0) return;

                images[slideshowImageIndex].classList.remove('active');
                dots[slideshowImageIndex].classList.remove('active');

                slideshowImageIndex = index;

                images[slideshowImageIndex].classList.add('active');
                dots[slideshowImageIndex].classList.add('active');

                // Timer zurücksetzen
                if (slideshowTimer) clearInterval(slideshowTimer);
                startSlideshowRotation();
            }

            function hideSlideshow() {
                slideshowOverlay.classList.remove('visible');
                if (slideshowTimer) {
                    clearInterval(slideshowTimer);
                    slideshowTimer = null;
                }
            }

            document.getElementById('slideshowClose').addEventListener('click', hideSlideshow);

            // ========================================
            // KAMERA
            // ========================================
            let orbitAnimation = null;

            function cancelOrbit() {
                if (orbitAnimation) {
                    viewer.scene.postRender.removeEventListener(orbitAnimation);
                    orbitAnimation = null;
                }
            }

            function cancelScheduledFlight() {
                if (flightTimeout) { clearTimeout(flightTimeout); flightTimeout = null; }
            }

            function flyToDestination(index) {
                if (index < 0 || index >= destinations.length) return;
                cancelScheduledFlight();
                cancelOrbit();
                hideSlideshow();

                currentStation = index;
                animationInProgress = true;
                updateUI();

                const dest = destinations[currentStation];

                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, dest.altitude),
                    orientation: {
                        heading: Cesium.Math.toRadians(dest.heading),
                        pitch: Cesium.Math.toRadians(dest.pitch),
                        roll: Cesium.Math.toRadians(0)
                    },
                    duration: dest.duration,
                    easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT,
                    complete: function() {
                        animationInProgress = false;
                        lockCameraNorthDown(dest);
                        // Slideshow nach kurzer Pause
                        setTimeout(() => showSlideshow(dest), 800);
                    }
                });
            }

            function lockCameraNorthDown(dest) {
                cancelOrbit();
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, dest.altitude),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(dest.pitch),
                        roll: Cesium.Math.toRadians(0)
                    }
                });
            }

            function nextStation() {
                if (animationInProgress) return;
                cancelScheduledFlight();
                hideSlideshow();
                if (currentStation < destinations.length - 1) flyToDestination(currentStation + 1);
            }

            function prevStation() {
                if (animationInProgress) return;
                cancelScheduledFlight();
                hideSlideshow();
                if (currentStation > 0) flyToDestination(currentStation - 1);
            }

            const originalFlyTo = flyToDestination;
            flyToDestination = function(index) {
                cancelScheduledFlight(); cancelOrbit(); hideSlideshow();
                originalFlyTo(index);
                const dest = destinations[index];
                if (isAutoPlaying && index < destinations.length - 1) {
                    flightTimeout = setTimeout(() => {
                        if (isAutoPlaying) nextStation();
                    }, (dest.duration * 1000) + 12000);
                }
            };

            // ========================================
            // BUTTONS & TASTATUR
            // ========================================
            document.getElementById('btnNext').addEventListener('click', () => {
                isAutoPlaying = false; btnPlay.classList.remove('active'); nextStation();
            });
            document.getElementById('btnPrev').addEventListener('click', () => {
                isAutoPlaying = false; btnPlay.classList.remove('active'); prevStation();
            });
            btnPlay.addEventListener('click', () => {
                isAutoPlaying = !isAutoPlaying;
                if (isAutoPlaying) { btnPlay.classList.add('active'); flyToDestination(currentStation); }
                else { btnPlay.classList.remove('active'); cancelScheduledFlight(); }
            });

            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowRight': isAutoPlaying = false; btnPlay.classList.remove('active'); nextStation(); break;
                    case 'ArrowLeft':  isAutoPlaying = false; btnPlay.classList.remove('active'); prevStation(); break;
                    case ' ': e.preventDefault();
                        isAutoPlaying = !isAutoPlaying;
                        if (isAutoPlaying) { btnPlay.classList.add('active'); flyToDestination(currentStation); }
                        else { btnPlay.classList.remove('active'); cancelScheduledFlight(); }
                        break;
                    case 'Escape': hideSlideshow(); break;
                }
            });

            setTimeout(() => flyToDestination(0), 1500);
            console.log('🌍 One World Tour bereit!');
        })();
    </script>
</body>
</html>

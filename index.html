<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One World Tour – Schulkonzert 2026</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        #infoPanel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: opacity 0.5s;
        }
        #infoPanel h1 {
            margin: 0;
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 2px;
        }
        #infoPanel h2 {
            margin: 5px 0 0 0;
            font-size: 1.1em;
            font-weight: 300;
            opacity: 0.85;
        }
        #progressBar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 600px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            z-index: 1000;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #2196F3, #FF9800, #9C27B0);
            background-size: 300% 100%;
            animation: gradientMove 3s ease infinite;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
            display: flex;
            gap: 10px;
        }
        #controls button {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
        }
        #controls button.active {
            background: rgba(76, 175, 80, 0.7);
            border-color: #4CAF50;
        }
        #stationList {
            position: absolute;
            top: 120px;
            right: 20px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
        #stationList .station {
            padding: 3px 0;
            opacity: 0.5;
            transition: opacity 0.5s;
        }
        #stationList .station.current {
            opacity: 1;
            font-weight: bold;
            color: #FFD700;
        }
        #stationList .station.done {
            opacity: 0.7;
            color: #4CAF50;
        }

        /* ============ SLIDESHOW OVERLAY ============ */
        #slideshowOverlay {
            position: absolute;
            bottom: -400px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            max-width: 90vw;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            z-index: 1002;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: bottom 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
            overflow: hidden;
            padding: 0;
        }
        #slideshowOverlay.visible {
            bottom: 90px;
        }
        #slideshowOverlay .slideshow-title {
            text-align: center;
            color: #FFD700;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1em;
            padding: 12px 20px 4px 20px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        #slideshowOverlay .slideshow-images {
            display: flex;
            gap: 10px;
            padding: 10px 20px 16px 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        #slideshowOverlay .slideshow-images img,
        #slideshowOverlay .slideshow-images video {
            width: 170px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
            background: #1a1a1a;
        }
        #slideshowOverlay .slideshow-images video {
            background: #000;
        }
        #slideshowClose {
            position: absolute;
            top: 8px;
            right: 14px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            cursor: pointer;
            z-index: 1003;
            pointer-events: auto;
        }
        #slideshowClose:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 650px) {
            #slideshowOverlay {
                width: 95vw;
            }
            #slideshowOverlay .slideshow-images img,
            #slideshowOverlay .slideshow-images video {
                width: 130px;
                height: 85px;
            }
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="infoPanel">
        <h1>🌍 One World Tour</h1>
        <h2 id="stationName">Start</h2>
    </div>
    <div id="stationList">
        <div class="station" data-station="0">1. Afrika – Africa (Toto)</div>
        <div class="station" data-station="1">2. Norwegen – Peer Gynt Suite</div>
        <div class="station" data-station="2">3. Ungarn – Ungarischer Tanz Nr. 5</div>
        <div class="station" data-station="3">4. Südamerika – Sunday in Rio</div>
        <div class="station" data-station="4">5. Irland – Irish Suite</div>
        <div class="station" data-station="5">6. China – Mo Li Hua</div>
        <div class="station" data-station="6">7. Südafrika – Baba Yetu</div>
    </div>
    <div id="progressBar">
        <div id="progressFill"></div>
    </div>
    <div id="controls">
        <button id="btnPrev" title="Vorherige Station">◀</button>
        <button id="btnPlay" class="active" title="Auto-Play">▶</button>
        <button id="btnNext" title="Nächste Station">▶▶</button>
    </div>

    <!-- SLIDESHOW OVERLAY -->
    <div id="slideshowOverlay">
        <button id="slideshowClose" title="Schließen">✕</button>
        <div class="slideshow-title" id="slideshowTitle"></div>
        <div class="slideshow-images" id="slideshowImages"></div>
    </div>

    <script>
        (async function initCesium() {
            // Cesium Ion Token
            Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI1NGU3YzJkYi1mNTRjLTQxNDAtYTA2Ny02OTJlMjFiMzljOWUiLCJpZCI6NDQ1MTUxLCJzdWIiOiJBbEoiLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoiT25lV29ybGQiLCJpYXQiOjE3ODE2MDQwNTl9.bWQpQQXdJoZ1CLp190p4YJkS9AtMi0m99vyVMOOejYY';

            // Initialize Cesium Viewer
            const viewer = new Cesium.Viewer('cesiumContainer', {
                animation: false,
                timeline: false,
                baseLayerPicker: false,
                fullscreenButton: false,
                homeButton: false,
                sceneModePicker: false,
                navigationHelpButton: false,
                geocoder: false,
                selectionIndicator: false,
                infoBox: false
            });

            // Sentinel-2 Satellitenbilder
            viewer.imageryLayers.removeAll();
            viewer.imageryLayers.addImageryProvider(
                await Cesium.IonImageryProvider.fromAssetId(3954)
            );

            // Atmosphere & Beleuchtung
            viewer.scene.skyAtmosphere.show = true;
            viewer.scene.globe.enableLighting = true;
            viewer.scene.globe.showGroundAtmosphere = true;

            // Credits ausblenden
            viewer.cesiumWidget.creditContainer.style.display = 'none';

            // ========================================
            // DESTINATIONS (mit Medien für die Slideshow)
            // ========================================
            const destinations = [
                {
                    name: 'Afrika – Kilimandscharo Region',
                    subtitle: 'Africa (Toto)',
                    lat: -3.07,
                    lon: 37.35,
                    altitude: 800000,
                    heading: 0,
                    pitch: -50,
                    roll: 0,
                    duration: 8,
                    slideshowTitle: '🇹🇿 Tansania – Am Fuße des Kilimandscharo',
                    media: [
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Mount_Kilimanjaro.jpg/320px-Mount_Kilimanjaro.jpg', alt: 'Kilimandscharo' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Zebras_Serengeti.JPG/320px-Zebras_Serengeti.JPG', alt: 'Serengeti' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Maasai_women_and_children.jpg/320px-Maasai_women_and_children.jpg', alt: 'Massai' }
                    ]
                },
                {
                    name: 'Norwegen – Fjorde & Berge',
                    subtitle: 'Peer Gynt Suite (Grieg)',
                    lat: 62.0,
                    lon: 9.0,
                    altitude: 650000,
                    heading: 0,
                    pitch: -55,
                    roll: 0,
                    duration: 8,
                    slideshowTitle: '🇳🇴 Norwegen – Land der Fjorde',
                    media: [
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Geirangerfjord_%286-2007%29.jpg/320px-Geirangerfjord_%286-2007%29.jpg', alt: 'Geirangerfjord' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Trolltunga.jpg/320px-Trolltunga.jpg', alt: 'Trolltunga' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Edvard_Grieg_%281888%29_by_Elliot_%26_Fry.jpg/320px-Edvard_Grieg_%281888%29_by_Elliot_%26_Fry.jpg', alt: 'Edvard Grieg' }
                    ]
                },
                {
                    name: 'Ungarn – Puszta',
                    subtitle: 'Ungarischer Tanz Nr. 5 (Brahms)',
                    lat: 47.2,
                    lon: 19.0,
                    altitude: 550000,
                    heading: 0,
                    pitch: -50,
                    roll: 0,
                    duration: 7,
                    slideshowTitle: '🇭🇺 Ungarn – Puszta & Budapest',
                    media: [
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Budapest_Parliament_4604.jpg/320px-Budapest_Parliament_4604.jpg', alt: 'Parlament Budapest' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/Hortob%C3%A1gy-%C3%B6szt%C3%B6n_1.jpg/320px-Hortob%C3%A1gy-%C3%B6szt%C3%B6n_1.jpg', alt: 'Puszta' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/Johannes_Brahms_1853.jpg/320px-Johannes_Brahms_1853.jpg', alt: 'Johannes Brahms' }
                    ]
                },
                {
                    name: 'Südamerika – Brasilien',
                    subtitle: 'Sunday in Rio / La Cucaracha',
                    lat: -18.0,
                    lon: -45.0,
                    altitude: 2800000,
                    heading: 0,
                    pitch: -55,
                    roll: 0,
                    duration: 8,
                    slideshowTitle: '🇧🇷 Brasilien – Karneval & Samba',
                    media: [
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Cidade_Maravilhosa.jpg/320px-Cidade_Maravilhosa.jpg', alt: 'Rio de Janeiro' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Carnaval_Rio_2012.jpg/320px-Carnaval_Rio_2012.jpg', alt: 'Karneval Rio' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Amazonas-Fluss.jpg/320px-Amazonas-Fluss.jpg', alt: 'Amazonas' }
                    ]
                },
                {
                    name: 'Irland – Grüne Insel',
                    subtitle: 'Irish Suite (Anderson)',
                    lat: 53.0,
                    lon: -8.0,
                    altitude: 650000,
                    heading: 0,
                    pitch: -55,
                    roll: 0,
                    duration: 7,
                    slideshowTitle: '🇮🇪 Irland – Die grüne Insel',
                    media: [
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Cliffs_of_Moher_%28South%29.jpg/320px-Cliffs_of_Moher_%28South%29.jpg', alt: 'Cliffs of Moher' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Concertina.jpg/320px-Concertina.jpg', alt: 'Concertina' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Irish_dancers_at_the_St._Patrick%27s_Day_parade_in_Dublin.jpg/320px-Irish_dancers_at_the_St._Patrick%27s_Day_parade_in_Dublin.jpg', alt: 'Irish Dance' }
                    ]
                },
                {
                    name: 'China – Jasminblüte',
                    subtitle: 'Mo Li Hua',
                    lat: 33.0,
                    lon: 105.0,
                    altitude: 2200000,
                    heading: 0,
                    pitch: -55,
                    roll: 0,
                    duration: 8,
                    slideshowTitle: '🇨🇳 China – Reich der Mitte',
                    media: [
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/The_Great_Wall_of_China_at_Jinshanling.jpg/320px-The_Great_Wall_of_China_at_Jinshanling.jpg', alt: 'Chinesische Mauer' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Jasminum_polyanthum.jpg/320px-Jasminum_polyanthum.jpg', alt: 'Jasminblüte' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Shanghai_Skyline%2C_Dec2014.jpg/320px-Shanghai_Skyline%2C_Dec2014.jpg', alt: 'Shanghai' }
                    ]
                },
                {
                    name: 'Südafrika',
                    subtitle: 'Baba Yetu',
                    lat: -28.0,
                    lon: 25.0,
                    altitude: 2500000,
                    heading: 0,
                    pitch: -60,
                    roll: 0,
                    duration: 9,
                    slideshowTitle: '🇿🇦 Südafrika – Regenbogennation',
                    media: [
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Table_Mountain_DanieVDM.jpg/320px-Table_Mountain_DanieVDM.jpg', alt: 'Tafelberg' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/South_African_choir.jpg/320px-South_African_choir.jpg', alt: 'Südafrikanischer Chor' },
                        { type: 'image', src: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Kruger_National_Park_%282848258721%29.jpg/320px-Kruger_National_Park_%282848258721%29.jpg', alt: 'Krüger Nationalpark' }
                    ]
                }
            ];

            let currentStation = 0;
            let isAutoPlaying = true;
            let flightTimeout = null;
            let slideshowTimeout = null;
            let animationInProgress = false;

            // UI Elements
            const stationNameEl = document.getElementById('stationName');
            const progressFill = document.getElementById('progressFill');
            const btnPlay = document.getElementById('btnPlay');
            const stationItems = document.querySelectorAll('#stationList .station');
            const slideshowOverlay = document.getElementById('slideshowOverlay');
            const slideshowTitle = document.getElementById('slideshowTitle');
            const slideshowImages = document.getElementById('slideshowImages');

            function updateUI() {
                stationNameEl.textContent = `${destinations[currentStation].name} – ${destinations[currentStation].subtitle}`;
                progressFill.style.width = `${((currentStation) / (destinations.length - 1)) * 100}%`;

                stationItems.forEach((item, index) => {
                    item.classList.remove('current', 'done');
                    if (index === currentStation) item.classList.add('current');
                    if (index < currentStation) item.classList.add('done');
                });
            }

            // Slideshow-Funktionen
            function showSlideshow(dest) {
                if (!dest.media || dest.media.length === 0) return;

                slideshowTitle.textContent = dest.slideshowTitle || '';
                slideshowImages.innerHTML = '';

                dest.media.forEach(item => {
                    if (item.type === 'image') {
                        const img = document.createElement('img');
                        img.src = item.src;
                        img.alt = item.alt || '';
                        img.title = item.alt || '';
                        img.loading = 'lazy';
                        img.onerror = function() {
                            this.style.display = 'none';
                        };
                        slideshowImages.appendChild(img);
                    } else if (item.type === 'video') {
                        const video = document.createElement('video');
                        video.src = item.src;
                        video.controls = false;
                        video.muted = true;
                        video.loop = true;
                        video.playsInline = true;
                        video.title = item.alt || '';
                        video.onerror = function() {
                            this.style.display = 'none';
                        };
                        slideshowImages.appendChild(video);
                        video.play().catch(() => {});
                    }
                });

                slideshowOverlay.classList.add('visible');
            }

            function hideSlideshow() {
                slideshowOverlay.classList.remove('visible');
                if (slideshowTimeout) {
                    clearTimeout(slideshowTimeout);
                    slideshowTimeout = null;
                }
            }

            document.getElementById('slideshowClose').addEventListener('click', hideSlideshow);

            let orbitAnimation = null;

            function cancelOrbit() {
                if (orbitAnimation) {
                    viewer.scene.postRender.removeEventListener(orbitAnimation);
                    orbitAnimation = null;
                }
            }

            function cancelScheduledFlight() {
                if (flightTimeout) {
                    clearTimeout(flightTimeout);
                    flightTimeout = null;
                }
            }

            // Fly to destination
            function flyToDestination(index) {
                if (index < 0 || index >= destinations.length) return;

                cancelScheduledFlight();
                cancelOrbit();
                hideSlideshow();

                currentStation = index;
                animationInProgress = true;
                updateUI();

                const dest = destinations[currentStation];

                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, dest.altitude),
                    orientation: {
                        heading: Cesium.Math.toRadians(dest.heading),
                        pitch: Cesium.Math.toRadians(dest.pitch),
                        roll: Cesium.Math.toRadians(dest.roll || 0)
                    },
                    duration: dest.duration,
                    easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT,
                    complete: function() {
                        animationInProgress = false;
                        lockCameraNorthDown(dest);

                        // Nach 1 Sekunde Slideshow einblenden
                        slideshowTimeout = setTimeout(() => {
                            showSlideshow(dest);
                        }, 1000);
                    }
                });
            }

            function lockCameraNorthDown(dest) {
                cancelOrbit();
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, dest.altitude),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(dest.pitch),
                        roll: Cesium.Math.toRadians(0)
                    }
                });
            }

            function nextStation() {
                if (animationInProgress) return;
                cancelScheduledFlight();
                hideSlideshow();
                if (currentStation < destinations.length - 1) {
                    flyToDestination(currentStation + 1);
                }
            }

            function prevStation() {
                if (animationInProgress) return;
                cancelScheduledFlight();
                hideSlideshow();
                if (currentStation > 0) {
                    flyToDestination(currentStation - 1);
                }
            }

            // Auto-Play
            const originalFlyTo = flyToDestination;
            flyToDestination = function(index) {
                cancelScheduledFlight();
                cancelOrbit();
                hideSlideshow();
                originalFlyTo(index);

                const dest = destinations[index];
                if (isAutoPlaying && index < destinations.length - 1) {
                    // Slideshow bleibt ~6 Sekunden sichtbar, dann Weiterflug
                    const slideShowDuration = 6000;
                    flightTimeout = setTimeout(() => {
                        if (isAutoPlaying) nextStation();
                    }, (dest.duration * 1000) + slideShowDuration);
                }
            };

            // Button-Events
            document.getElementById('btnNext').addEventListener('click', () => {
                isAutoPlaying = false;
                btnPlay.classList.remove('active');
                nextStation();
            });

            document.getElementById('btnPrev').addEventListener('click', () => {
                isAutoPlaying = false;
                btnPlay.classList.remove('active');
                prevStation();
            });

            btnPlay.addEventListener('click', () => {
                isAutoPlaying = !isAutoPlaying;
                if (isAutoPlaying) {
                    btnPlay.classList.add('active');
                    flyToDestination(currentStation);
                } else {
                    btnPlay.classList.remove('active');
                    cancelScheduledFlight();
                }
            });

            // Tastatur
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowRight':
                        isAutoPlaying = false;
                        btnPlay.classList.remove('active');
                        nextStation();
                        break;
                    case 'ArrowLeft':
                        isAutoPlaying = false;
                        btnPlay.classList.remove('active');
                        prevStation();
                        break;
                    case ' ':
                        e.preventDefault();
                        isAutoPlaying = !isAutoPlaying;
                        if (isAutoPlaying) {
                            btnPlay.classList.add('active');
                            flyToDestination(currentStation);
                        } else {
                            btnPlay.classList.remove('active');
                            cancelScheduledFlight();
                        }
                        break;
                    case 'Escape':
                        hideSlideshow();
                        break;
                }
            });

            // Start
            setTimeout(() => {
                flyToDestination(0);
            }, 1500);

            console.log('🌍 One World Tour bereit!');
            console.log('Stationen:', destinations.map(d => d.name).join(' → '));
        })();
    </script>
</body>
</html>

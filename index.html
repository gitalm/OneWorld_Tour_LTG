<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One World Tour – Schulkonzert 2026</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #infoPanel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: opacity 0.5s;
        }
        #infoPanel h1 {
            margin: 0;
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 2px;
        }
        #infoPanel h2 {
            margin: 5px 0 0 0;
            font-size: 1.1em;
            font-weight: 300;
            opacity: 0.85;
        }
        #progressBar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 600px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            z-index: 1000;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #2196F3, #FF9800, #9C27B0);
            background-size: 300% 100%;
            animation: gradientMove 3s ease infinite;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        #controls button {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
        }
        #controls button.active {
            background: rgba(76, 175, 80, 0.7);
            border-color: #4CAF50;
        }
        #stationList {
            position: absolute;
            top: 120px;
            right: 20px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
        #stationList .station {
            padding: 3px 0;
            opacity: 0.5;
            transition: opacity 0.5s;
        }
        #stationList .station.current {
            opacity: 1;
            font-weight: bold;
            color: #FFD700;
        }
        #stationList .station.done {
            opacity: 0.7;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="infoPanel">
        <h1>🌍 One World Tour</h1>
        <h2 id="stationName">Start</h2>
    </div>
    <div id="stationList">
        <div class="station" data-station="0">1. Afrika – Africa (Toto)</div>
        <div class="station" data-station="1">2. Norwegen – Peer Gynt Suite</div>
        <div class="station" data-station="2">3. Ungarn – Ungarischer Tanz Nr. 5</div>
        <div class="station" data-station="3">4. Südamerika – Sunday in Rio</div>
        <div class="station" data-station="4">5. Irland – Irish Suite</div>
        <div class="station" data-station="5">6. China – Mo Li Hua</div>
        <div class="station" data-station="6">7. Afrika – Baba Yetu</div>
    </div>
    <div id="progressBar">
        <div id="progressFill"></div>
    </div>
    <div id="controls">
        <button id="btnPrev" title="Vorherige Station">◀</button>
        <button id="btnPlay" class="active" title="Auto-Play">▶</button>
        <button id="btnNext" title="Nächste Station">▶▶</button>
    </div>

    <script>
        // Cesium Ion Token (kostenlos unter https://ion.cesium.com/ registrieren)
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlYWE1OWUxNy1mMWZiLTQzYjYtYTQ0OS1jMWUxOGNkZmU4MmQiLCJpZCI6NTcwMzIsImlhdCI6MTYyMjA0NjM4Mn0.Br4cK7CqMqJ1sWpJ3VqZv9uKX3dYx0fYzL4a6h8j9k0';

        // Initialize Cesium Viewer
        const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false,
            timeline: false,
            baseLayerPicker: false,
            fullscreenButton: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            geocoder: false,
            selectionIndicator: false,
            infoBox: false
        });

        // Remove default imagery and add a nicer one
        viewer.imageryLayers.removeAll();
        viewer.imageryLayers.addImageryProvider(
            new Cesium.IonImageryProvider({ assetId: 3812 }) // Sentinel-2 (schönere Erde)
        );

        // Enable stars and atmosphere
        viewer.scene.skyAtmosphere.show = true;
        viewer.scene.globe.enableLighting = true;
        viewer.scene.globe.showGroundAtmosphere = true;

        // Flight destinations with coordinates and viewing angles
        // Each destination: { name, lat, lon, altitude (meters), heading (degrees), pitch (negative = looking down), roll, duration (seconds) }
        const destinations = [
            {
                name: 'Afrika – Kilimandscharo Region',
                subtitle: 'Africa (Toto)',
                lat: -3.07,
                lon: 37.35,
                altitude: 800000,
                heading: 45,
                pitch: -50,
                roll: 0,
                duration: 8,
                description: 'Tansania / Kenia – Region des Kilimandscharo'
            },
            {
                name: 'Norwegen – Fjorde',
                subtitle: 'Peer Gynt Suite (Grieg)',
                lat: 62.0,
                lon: 7.0,
                altitude: 600000,
                heading: 180,
                pitch: -55,
                roll: 0,
                duration: 8,
                description: 'Norwegische Fjordlandschaft'
            },
            {
                name: 'Ungarn – Puszta',
                subtitle: 'Ungarischer Tanz Nr. 5 (Brahms)',
                lat: 47.0,
                lon: 19.5,
                altitude: 500000,
                heading: 90,
                pitch: -50,
                roll: 0,
                duration: 7,
                description: 'Budapest und die ungarische Tiefebene'
            },
            {
                name: 'Südamerika – Brasilien',
                subtitle: 'Sunday in Rio / La Cucaracha',
                lat: -10.0,
                lon: -50.0,
                altitude: 2500000,
                heading: 270,
                pitch: -55,
                roll: 0,
                duration: 8,
                description: 'Brasilien – von Rio bis zum Amazonas'
            },
            {
                name: 'Irland – Grüne Insel',
                subtitle: 'Irish Suite (Anderson)',
                lat: 53.3,
                lon: -8.0,
                altitude: 500000,
                heading: 0,
                pitch: -50,
                roll: 0,
                duration: 7,
                description: 'Die gesamte grüne Insel im Blick'
            },
            {
                name: 'China – Jasminblüte',
                subtitle: 'Mo Li Hua',
                lat: 32.0,
                lon: 108.0,
                altitude: 1800000,
                heading: 135,
                pitch: -55,
                roll: 0,
                duration: 8,
                description: 'China – Reich der Mitte'
            },
            {
                name: 'Afrika – Rückkehr',
                subtitle: 'Baba Yetu',
                lat: 0.0,
                lon: 25.0,
                altitude: 3000000,
                heading: 0,
                pitch: -60,
                roll: 0,
                duration: 9,
                description: 'Der ganze afrikanische Kontinent'
            }
        ];

        let currentStation = 0;
        let isAutoPlaying = true;
        let flightTimeout = null;
        let animationInProgress = false;

        // UI Elements
        const stationNameEl = document.getElementById('stationName');
        const progressFill = document.getElementById('progressFill');
        const btnPlay = document.getElementById('btnPlay');
        const stationItems = document.querySelectorAll('#stationList .station');

        function updateUI() {
            stationNameEl.textContent = `${destinations[currentStation].name} – ${destinations[currentStation].subtitle}`;
            progressFill.style.width = `${((currentStation) / (destinations.length - 1)) * 100}%`;

            stationItems.forEach((item, index) => {
                item.classList.remove('current', 'done');
                if (index === currentStation) item.classList.add('current');
                if (index < currentStation) item.classList.add('done');
            });
        }

        // Fly to a destination with camera always looking at Earth
        function flyToDestination(index) {
            if (index < 0 || index >= destinations.length) return;
            
            currentStation = index;
            animationInProgress = true;
            updateUI();

            const dest = destinations[currentStation];
            
            // Calculate camera position so it always looks toward Earth center
            // Using Cesium's flyTo with a heading/pitch/range approach
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(
                    dest.lon,
                    dest.lat,
                    dest.altitude
                ),
                orientation: {
                    heading: Cesium.Math.toRadians(dest.heading),
                    pitch: Cesium.Math.toRadians(dest.pitch), // Negative = looking down at Earth
                    roll: Cesium.Math.toRadians(dest.roll || 0)
                },
                duration: dest.duration,
                easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT,
                complete: function() {
                    animationInProgress = false;
                    // Small gentle rotation after arrival for a nice effect
                    startGentleOrbit(dest);
                }
            });
        }

        let orbitAnimation = null;

        function startGentleOrbit(dest) {
            // Cancel any previous gentle orbit
            if (orbitAnimation) {
                viewer.scene.postRender.removeEventListener(orbitAnimation);
                orbitAnimation = null;
            }

            let startTime = null;
            const orbitDuration = 6; // seconds for gentle pan
            const totalOrbitDegrees = 15; // gentle rotation degrees

            orbitAnimation = function(scene, time) {
                if (!startTime) startTime = time;
                const elapsed = Cesium.JulianDate.secondsDifference(time, startTime);
                
                if (elapsed < orbitDuration) {
                    const progress = elapsed / orbitDuration;
                    const easeProgress = 0.5 - 0.5 * Math.cos(Math.PI * progress); // smooth ease
                    const extraHeading = totalOrbitDegrees * easeProgress;
                    
                    const camera = viewer.camera;
                    const currentHeading = dest.heading + extraHeading;
                    
                    camera.setView({
                        destination: Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, dest.altitude),
                        orientation: {
                            heading: Cesium.Math.toRadians(currentHeading),
                            pitch: Cesium.Math.toRadians(dest.pitch),
                            roll: Cesium.Math.toRadians(dest.roll || 0)
                        }
                    });
                } else {
                    if (orbitAnimation) {
                        viewer.scene.postRender.removeEventListener(orbitAnimation);
                        orbitAnimation = null;
                    }
                }
            };

            viewer.scene.postRender.addEventListener(orbitAnimation);
        }

        function nextStation() {
            if (animationInProgress) return;
            cancelScheduledFlight();
            if (currentStation < destinations.length - 1) {
                flyToDestination(currentStation + 1);
            }
        }

        function prevStation() {
            if (animationInProgress) return;
            cancelScheduledFlight();
            if (currentStation > 0) {
                flyToDestination(currentStation - 1);
            }
        }

        function cancelScheduledFlight() {
            if (flightTimeout) {
                clearTimeout(flightTimeout);
                flightTimeout = null;
            }
        }

        function startAutoPlay() {
            if (currentStation >= destinations.length - 1) {
                currentStation = 0;
                flyToDestination(0);
                return;
            }
            flyToDestination(currentStation);
        }

        function scheduleNextFlight() {
            if (!isAutoPlaying) return;
            if (currentStation < destinations.length - 1) {
                const dest = destinations[currentStation];
                flightTimeout = setTimeout(() => {
                    nextStation();
                }, (dest.duration + 6) * 1000); // flight duration + gentle orbit time
            }
        }

        // Override flyToDestination to auto-schedule next flight
        const originalFlyTo = flyToDestination;
        flyToDestination = function(index) {
            cancelScheduledFlight();
            if (orbitAnimation) {
                viewer.scene.postRender.removeEventListener(orbitAnimation);
                orbitAnimation = null;
            }
            originalFlyTo(index);

            // After the flight completes (duration + some buffer), schedule next
            const dest = destinations[index];
            const totalTime = (dest.duration + 6) * 1000;
            if (isAutoPlaying && index < destinations.length - 1) {
                flightTimeout = setTimeout(() => {
                    if (isAutoPlaying) {
                        nextStation();
                    }
                }, totalTime);
            }
        };

        // Button event handlers
        document.getElementById('btnNext').addEventListener('click', () => {
            isAutoPlaying = false;
            btnPlay.classList.remove('active');
            nextStation();
        });

        document.getElementById('btnPrev').addEventListener('click', () => {
            isAutoPlaying = false;
            btnPlay.classList.remove('active');
            prevStation();
        });

        btnPlay.addEventListener('click', () => {
            isAutoPlaying = !isAutoPlaying;
            if (isAutoPlaying) {
                btnPlay.classList.add('active');
                // Continue from current station
                flyToDestination(currentStation);
            } else {
                btnPlay.classList.remove('active');
                cancelScheduledFlight();
            }
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowRight':
                    isAutoPlaying = false;
                    btnPlay.classList.remove('active');
                    nextStation();
                    break;
                case 'ArrowLeft':
                    isAutoPlaying = false;
                    btnPlay.classList.remove('active');
                    prevStation();
                    break;
                case ' ':
                    e.preventDefault();
                    isAutoPlaying = !isAutoPlaying;
                    if (isAutoPlaying) {
                        btnPlay.classList.add('active');
                        flyToDestination(currentStation);
                    } else {
                        btnPlay.classList.remove('active');
                        cancelScheduledFlight();
                    }
                    break;
            }
        });

        // Initial flight
        setTimeout(() => {
            flyToDestination(0);
        }, 1500);

        // Hide Cesium logo watermark (optional)
        viewer.cesiumWidget.creditContainer.style.display = 'none';

        console.log('🌍 One World Tour bereit!');
        console.log('Stationen:', destinations.map(d => d.name).join(' → '));
        console.log('Steuerung: Pfeiltasten ← → | Leertaste = Play/Pause | Buttons unten rechts');
    </script>
</body>
</html>

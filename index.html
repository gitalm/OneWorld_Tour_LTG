<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One World Tour – Schulkonzert 2026</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        #infoPanel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: opacity 0.5s;
        }
        #infoPanel h1 {
            margin: 0;
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 2px;
        }
        #infoPanel h2 {
            margin: 5px 0 0 0;
            font-size: 1.1em;
            font-weight: 300;
            opacity: 0.85;
        }
        #progressBar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 600px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            z-index: 1000;
            overflow: hidden;
        }
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #2196F3, #FF9800, #9C27B0);
            background-size: 300% 100%;
            animation: gradientMove 3s ease infinite;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        #controls button {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
        }
        #controls button.active {
            background: rgba(76, 175, 80, 0.7);
            border-color: #4CAF50;
        }
        #stationList {
            position: absolute;
            top: 120px;
            right: 20px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            z-index: 1000;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }
        #stationList .station {
            padding: 3px 0;
            opacity: 0.5;
            transition: opacity 0.5s;
        }
        #stationList .station.current {
            opacity: 1;
            font-weight: bold;
            color: #FFD700;
        }
        #stationList .station.done {
            opacity: 0.7;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="infoPanel">
        <h1>🌍 One World Tour</h1>
        <h2 id="stationName">Start</h2>
    </div>
    <div id="stationList">
        <div class="station" data-station="0">1. Afrika – Africa (Toto)</div>
        <div class="station" data-station="1">2. Norwegen – Peer Gynt Suite</div>
        <div class="station" data-station="2">3. Ungarn – Ungarischer Tanz Nr. 5</div>
        <div class="station" data-station="3">4. Südamerika – Sunday in Rio</div>
        <div class="station" data-station="4">5. Irland – Irish Suite</div>
        <div class="station" data-station="5">6. China – Mo Li Hua</div>
        <div class="station" data-station="6">7. Afrika – Baba Yetu</div>
    </div>
    <div id="progressBar">
        <div id="progressFill"></div>
    </div>
    <div id="controls">
        <button id="btnPrev" title="Vorherige Station">◀</button>
        <button id="btnPlay" class="active" title="Auto-Play">▶</button>
        <button id="btnNext" title="Nächste Station">▶▶</button>
    </div>

    <script>
        (async function initCesium() {
            // Cesium Ion Token (ersetzen mit deinem eigenen Token)
            Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI1NGU3YzJkYi1mNTRjLTQxNDAtYTA2Ny02OTJlMjFiMzljOWUiLCJpZCI6NDQ1MTUxLCJzdWIiOiJBbEoiLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoiT25lV29ybGQiLCJpYXQiOjE3ODE2MDQwNTl9.bWQpQQXdJoZ1CLp190p4YJkS9AtMi0m99vyVMOOejYY';

            // Initialize Cesium Viewer
            const viewer = new Cesium.Viewer('cesiumContainer', {
                animation: false,
                timeline: false,
                baseLayerPicker: false,
                fullscreenButton: false,
                homeButton: false,
                sceneModePicker: false,
                navigationHelpButton: false,
                geocoder: false,
                selectionIndicator: false,
                infoBox: false
            });

            // Sentinel-2 Satellitenbilder
            viewer.imageryLayers.removeAll();
            viewer.imageryLayers.addImageryProvider(
                await Cesium.IonImageryProvider.fromAssetId(3954)
            );

            // Atmosphere & Beleuchtung
            viewer.scene.skyAtmosphere.show = true;
            viewer.scene.globe.enableLighting = true;
            viewer.scene.globe.showGroundAtmosphere = true;

            // Credits ausblenden
            viewer.cesiumWidget.creditContainer.style.display = 'none';

            // ========================================
            // DESTINATIONS (Norden ist immer oben!)
            // heading: 0 = Norden oben, pitch: negativ = Blick zur Erde
            // ========================================
            const destinations = [
                {
                    name: 'Afrika – Kilimandscharo Region',
                    subtitle: 'Africa (Toto)',
                    lat: -3.07,
                    lon: 37.35,
                    altitude: 800000,
                    heading: 0,
                    pitch: -50,
                    roll: 0,
                    duration: 8,
                    description: 'Tansania / Kenia – Region des Kilimandscharo'
                },
                {
                    name: 'Norwegen – Fjorde',
                    subtitle: 'Peer Gynt Suite (Grieg)',
                    lat: 62.5,
                    lon: 7.5,
                    altitude: 700000,
                    heading: 0,
                    pitch: -55,
                    roll: 0,
                    duration: 8,
                    description: 'Norwegische Fjordlandschaft'
                },
                {
                    name: 'Ungarn – Puszta',
                    subtitle: 'Ungarischer Tanz Nr. 5 (Brahms)',
                    lat: 47.2,
                    lon: 19.0,
                    altitude: 550000,
                    heading: 0,
                    pitch: -50,
                    roll: 0,
                    duration: 7,
                    description: 'Budapest und die ungarische Tiefebene'
                },
                {
                    name: 'Südamerika – Brasilien',
                    subtitle: 'Sunday in Rio / La Cucaracha',
                    lat: -12.0,
                    lon: -52.0,
                    altitude: 2500000,
                    heading: 0,
                    pitch: -55,
                    roll: 0,
                    duration: 8,
                    description: 'Brasilien – von Rio bis zum Amazonas'
                },
                {
                    name: 'Irland – Grüne Insel',
                    subtitle: 'Irish Suite (Anderson)',
                    lat: 53.0,
                    lon: -8.0,
                    altitude: 650000,
                    heading: 0,
                    pitch: -55,
                    roll: 0,
                    duration: 7,
                    description: 'Die gesamte grüne Insel im Blick'
                },
                {
                    name: 'China – Jasminblüte',
                    subtitle: 'Mo Li Hua',
                    lat: 33.0,
                    lon: 105.0,
                    altitude: 2200000,
                    heading: 0,
                    pitch: -55,
                    roll: 0,
                    duration: 8,
                    description: 'China – Reich der Mitte'
                },
                {
                    name: 'Afrika – Rückkehr',
                    subtitle: 'Baba Yetu',
                    lat: 2.0,
                    lon: 22.0,
                    altitude: 3500000,
                    heading: 0,
                    pitch: -60,
                    roll: 0,
                    duration: 9,
                    description: 'Der ganze afrikanische Kontinent'
                }
            ];

            let currentStation = 0;
            let isAutoPlaying = true;
            let flightTimeout = null;
            let animationInProgress = false;

            // UI Elements
            const stationNameEl = document.getElementById('stationName');
            const progressFill = document.getElementById('progressFill');
            const btnPlay = document.getElementById('btnPlay');
            const stationItems = document.querySelectorAll('#stationList .station');

            function updateUI() {
                stationNameEl.textContent = `${destinations[currentStation].name} – ${destinations[currentStation].subtitle}`;
                progressFill.style.width = `${((currentStation) / (destinations.length - 1)) * 100}%`;

                stationItems.forEach((item, index) => {
                    item.classList.remove('current', 'done');
                    if (index === currentStation) item.classList.add('current');
                    if (index < currentStation) item.classList.add('done');
                });
            }

            let orbitAnimation = null;

            function cancelOrbit() {
                if (orbitAnimation) {
                    viewer.scene.postRender.removeEventListener(orbitAnimation);
                    orbitAnimation = null;
                }
            }

            function cancelScheduledFlight() {
                if (flightTimeout) {
                    clearTimeout(flightTimeout);
                    flightTimeout = null;
                }
            }

            // Fly to destination – Norden immer oben (heading = 0), Kamera blickt zur Erde
            function flyToDestination(index) {
                if (index < 0 || index >= destinations.length) return;

                cancelScheduledFlight();
                cancelOrbit();

                currentStation = index;
                animationInProgress = true;
                updateUI();

                const dest = destinations[currentStation];

                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, dest.altitude),
                    orientation: {
                        heading: Cesium.Math.toRadians(dest.heading),  // 0 = Norden oben
                        pitch: Cesium.Math.toRadians(dest.pitch),      // negativ = Blick zur Erde
                        roll: Cesium.Math.toRadians(dest.roll || 0)
                    },
                    duration: dest.duration,
                    easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT,
                    complete: function() {
                        animationInProgress = false;
                        // Nach Ankunft: Kamera festhalten – Norden bleibt oben!
                        lockCameraNorthDown(dest);
                    }
                });
            }

            // Kamera fixieren: Norden oben, Blick zur Erde (kein sanftes Drehen mehr)
            function lockCameraNorthDown(dest) {
                cancelOrbit();

                // Kamera einmalig korrekt setzen
                viewer.camera.setView({
                    destination: Cesium.Cartesian3.fromDegrees(dest.lon, dest.lat, dest.altitude),
                    orientation: {
                        heading: Cesium.Math.toRadians(0),
                        pitch: Cesium.Math.toRadians(dest.pitch),
                        roll: Cesium.Math.toRadians(0)
                    }
                });
            }

            function nextStation() {
                if (animationInProgress) return;
                cancelScheduledFlight();
                if (currentStation < destinations.length - 1) {
                    flyToDestination(currentStation + 1);
                }
            }

            function prevStation() {
                if (animationInProgress) return;
                cancelScheduledFlight();
                if (currentStation > 0) {
                    flyToDestination(currentStation - 1);
                }
            }

            // Auto-Play: Nach jeder Station automatisch weiter
            const originalFlyTo = flyToDestination;
            flyToDestination = function(index) {
                cancelScheduledFlight();
                cancelOrbit();
                originalFlyTo(index);

                const dest = destinations[index];
                if (isAutoPlaying && index < destinations.length - 1) {
                    flightTimeout = setTimeout(() => {
                        if (isAutoPlaying) nextStation();
                    }, (dest.duration + 5) * 1000);
                }
            };

            // Button-Events
            document.getElementById('btnNext').addEventListener('click', () => {
                isAutoPlaying = false;
                btnPlay.classList.remove('active');
                nextStation();
            });

            document.getElementById('btnPrev').addEventListener('click', () => {
                isAutoPlaying = false;
                btnPlay.classList.remove('active');
                prevStation();
            });

            btnPlay.addEventListener('click', () => {
                isAutoPlaying = !isAutoPlaying;
                if (isAutoPlaying) {
                    btnPlay.classList.add('active');
                    flyToDestination(currentStation);
                } else {
                    btnPlay.classList.remove('active');
                    cancelScheduledFlight();
                }
            });

            // Tastatur
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowRight':
                        isAutoPlaying = false;
                        btnPlay.classList.remove('active');
                        nextStation();
                        break;
                    case 'ArrowLeft':
                        isAutoPlaying = false;
                        btnPlay.classList.remove('active');
                        prevStation();
                        break;
                    case ' ':
                        e.preventDefault();
                        isAutoPlaying = !isAutoPlaying;
                        if (isAutoPlaying) {
                            btnPlay.classList.add('active');
                            flyToDestination(currentStation);
                        } else {
                            btnPlay.classList.remove('active');
                            cancelScheduledFlight();
                        }
                        break;
                }
            });

            // Start
            setTimeout(() => {
                flyToDestination(0);
            }, 1500);

            console.log('🌍 One World Tour bereit!');
            console.log('Stationen:', destinations.map(d => d.name).join(' → '));
            console.log('Norden ist immer oben | Kamera blickt stets zur Erde');
        })();
    </script>
</body>
</html>
